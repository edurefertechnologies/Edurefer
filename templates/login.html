<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduRefer</title>
    <meta name="description" content="Login to your EduRefer account to access your dashboard, track referrals, and manage rewards.">
    <meta name="keywords" content="edurefer, login, user account, dashboard access, referral tracking">
    <meta name="author" content="EduRefer">
    <meta property="og:title" content="Login - EduRefer">
    <meta property="og:description" content="Login to your EduRefer account to access your dashboard, track referrals, and manage rewards.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preload" href="static/login.css" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <noscript>
        <link rel="stylesheet" href="static/login.css">
    </noscript>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loader">
        Loading...
    </div>

    <main>
        <div class="container">

            <!-- LOGIN FORM -->
            <div class="logo-top">
                <img src="/static/Images/Edurefer Logo.png" alt="Edurefer Logo" class="logo-img" loading="lazy">
            </div>
            <div class="form-box Login">
                <h2 class="animation">Login</h2>

                <form id="loginForm">

                    <div class="input-box animation">
                        <label for="username">Username</label>
                        <input id="username" type="text" placeholder="Username" required>
                    </div>

                    <div class="input-box animation">
                        <label for="password">Password</label>
                        <input id="password" type="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-btn" style="margin-top: 10px;">Login</button>

                </form>

                <p class="regi-link">
                    Don't have an account?
                    <a href="#" onclick="goToRegister()">Register</a>
                </p>
            </div>
            <footer class="footer" style="text-align:center; padding:20px; color:#555;">

                <p>&copy; 2026 EduRefer. All rights Reserved.</p>

                <div class="footer-links">

                    <a href="terms.html" target="_blank"
                        style="color:#0ea5e9;font-weight:600;text-decoration:none;">Terms</a>
                    <a href="privacy.html" target="_blank"
                        style="color:#0ea5e9;font-weight:600;text-decoration:none;">Privacy</a>
                    <a href="refund.html" target="_blank"
                        style="color:#0ea5e9;font-weight:600;text-decoration:none;">Refund</a>

                </div>
            </footer>
        </div>
    </main>
    <script src="/static/config.js"></script>
    <script src="/static/auth.js"></script>

    <script>

        document.getElementById("loginForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const btn =
                    document.querySelector(".login-btn");

                btn.innerText = "Please wait...";
                btn.disabled = true;

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                try {

                    const response = await fetch("/api/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {

                        localStorage.setItem(
                            "edurefer_token",
                            data.token
                        );

                        localStorage.setItem(
                            "username",
                            username
                        );

                        smoothRedirect("dashboard.html");

                    } else {

                        alert(data.error || "Login failed");

                        btn.innerText = "Login";
                        btn.disabled = false;
                    }

                } catch (err) {

                    console.log(err);

                    alert("Server error");

                    btn.innerText = "Login";
                    btn.disabled = false;
                }

            });

        /* LOADER */
        window.onload = () => {
            document.getElementById("loader").style.display = "none";
        }

        /* SMOOTH REDIRECT */
        function smoothRedirect(url) {

            document.body.classList.add("fade-out");

            setTimeout(() => {
                window.location.href = url;
            }, 400);
        }

        /* PAGE LOAD */
        window.addEventListener("load", () => {
            document.body.classList.add("loaded");
        });

        /* GO TO REGISTER */
        function goToRegister() {

            smoothRedirect("register.html");

        }

    </script>

</body>

</html>
